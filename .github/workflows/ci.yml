name: CI

on:
  push:
    branches: ["**"]
  pull_request:

# Cancel superseded runs on the same ref.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev

      - name: ruff check
        run: uv run ruff check .

      # NOTE: `ruff format --check .` is intentionally not a gate yet — the
      # repo currently has pre-existing format drift across ~49 files. Run a
      # repo-wide `ruff format` first, then promote this to a blocking step.
      - name: ruff format --check (advisory)
        run: uv run ruff format --check .
        continue-on-error: true

  test:
    name: Test (pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Sync dependencies
        run: uv sync --group dev

      - name: Run test suite
        run: uv run pytest -q

  dockerfile-lint:
    name: Dockerfile lint (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Validates the Dockerfile without building the ~30 GB image, so it can
      # run on every push/PR. The heavy build lives in docker.yml (opt-in).
      - name: hadolint
        uses: hadolint/hadolint-action@v3.1.0
        with:
          dockerfile: Dockerfile
          # DL3008/DL3018/DL3028: pinning every apt/apk/gem version across a
          # security-tool image of this size is impractical and churn-prone.
          ignore: DL3008,DL3018,DL3028

[project]
name = "vuln-scanner"
version = "0.2.0"
description = "Automated Vulnerability Assessment and Report Generator"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "requests>=2.32",
    "openai>=1.0",
    "reportlab>=4.0",
    "pydantic-ai-slim[openai]>=1.0",
    "jinja2>=3.1",
]

[project.scripts]
vuln-scanner = "main:main"

[tool.uv]
package = true

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pre-commit>=4.6.0",
    "pytest>=8.0",
    "ruff>=0.15.21",
]

[tool.ruff]
line-length = 120
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = [
    "E501",   # line too long — handled by formatter
]
